# PII and secrets cases (format: BRIEF / tests/test_cases.py). policy.yaml runs pii_secrets in
# redact mode at input, tool_result and output with every type enabled.

- name: pii allows a clean prompt
  checkpoint: input
  messages:
    - {role: user, content: "How many customers signed up in Krakow last month?"}
  expect:
    action: allow
    check: pii_secrets

- name: pii redacts an SSN in the prompt
  checkpoint: input
  messages:
    - {role: user, content: "Update my file, ssn: 123-45-6789"}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "1 SSN"
    content_contains: "ssn: [REDACTED:SSN]"
    content_not_contains: "123-45-6789"

# The agent re-sends the raw conversation, so an earlier user message must be redacted again.
- name: pii redacts PII in an earlier user message
  checkpoint: input
  messages:
    - {role: user, content: "My email is jan.kowalski@example.pl"}
    - {role: assistant, content: "Thanks, noted."}
    - {role: user, content: "Now list my last three orders."}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "[REDACTED:EMAIL]"
    content_not_contains: "jan.kowalski@example.pl"

- name: pii redacts an API key value but keeps the variable name
  checkpoint: input
  messages:
    - {role: user, content: "Why does this fail? OPENAI_API_KEY=sk-proj-abcdefghijklmnopqrstuvwxyz123456"}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "API_KEY"
    content_contains: "OPENAI_API_KEY=[REDACTED:API_KEY]"
    content_not_contains: "sk-proj-abcdefghijklmnopqrstuvwxyz123456"

- name: pii allows order numbers timestamps and versions in a tool result
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show the latest order"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {query: "latest order"}}]}
    - {role: tool, tool_call_id: "1", content: '{"order": "#555-123-4567", "id": 100234, "created": "2026-10-03 15:57:12+02:00", "ts": 1696339200101, "client": "v2.31.0", "host": "192.168.100.200", "max_tokens": 1500}'}
  expect:
    action: allow
    check: pii_secrets

- name: pii allows a card number that fails the Luhn check
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show the payment reference"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {query: "payment ref"}}]}
    - {role: tool, tool_call_id: "1", content: "reference 4111 1111 1111 1112, PESEL-like id 44051401358"}
  expect:
    action: allow
    check: pii_secrets

- name: pii redacts a customer record in a tool result
  checkpoint: tool_result
  messages:
    - {role: user, content: "Look up customer 42"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 42}}]}
    - {role: tool, tool_call_id: "1", content: '{"id": 42, "name": "Jan Kowalski", "email": "jan.kowalski@example.pl", "phone": "+48 512 345 678", "pesel": "44051401359", "iban": "PL61 1090 1014 0000 0712 1981 2874", "card": "4111 1111 1111 1111"}'}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "1 CARD"
    content_contains: '"card": "[REDACTED:CARD]"'
    content_not_contains: "4111 1111 1111 1111"

- name: pii redacts an earlier tool result again
  checkpoint: tool_result
  messages:
    - {role: user, content: "Compare customers 42 and 43"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 42}}]}
    - {role: tool, tool_call_id: "1", content: "customer 42, ssn: 123-45-6789"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: query_customers, arguments: {id: 43}}]}
    - {role: tool, tool_call_id: "2", content: "customer 43, city: Gdansk"}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "customer 42, ssn: [REDACTED:SSN]"
    content_not_contains: "123-45-6789"

# A card followed by more digits (expiry, CVV) used to slip through.
- name: pii redacts a card followed by expiry and CVV
  checkpoint: input
  messages:
    - {role: user, content: "Card: 4111 1111 1111 1111 12/27 CVV 123, please book it"}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "1 CARD"
    content_contains: "Card: [REDACTED:CARD] 12/27"
    content_not_contains: "4111 1111 1111 1111"

- name: pii redacts a card that follows an SSN
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show customer 42"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 42}}]}
    - {role: tool, tool_call_id: "1", content: "123-45-6789 4111 1111 1111 1111"}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "[REDACTED:SSN] [REDACTED:CARD]"
    content_not_contains: "4111 1111 1111 1111"

- name: pii redacts an SSN written with spaces
  checkpoint: input
  messages:
    - {role: user, content: "My number is 123 45 6789, update it"}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "1 SSN"
    content_contains: "My number is [REDACTED:SSN], update it"

- name: pii redacts a bare 9-digit SSN under an SSN key
  checkpoint: tool_result
  messages:
    - {role: user, content: "Look up customer 42"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 42}}]}
    - {role: tool, tool_call_id: "1", content: '{"id": 42, "SSN": "123456789"}'}
  expect:
    action: redact
    check: pii_secrets
    content_contains: '"SSN": "[REDACTED:SSN]"'
    content_not_contains: "123456789"

- name: pii allows a bare 9-digit order number
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show the latest order"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {query: "latest order"}}]}
    - {role: tool, tool_call_id: "1", content: '{"order": 123456789, "total": "2874 PLN", "client": "1.13.0", "max_tokens": 4096}'}
  expect:
    action: allow
    check: pii_secrets

- name: pii redacts an AWS secret access key value
  checkpoint: input
  messages:
    - {role: user, content: "aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY why denied?"}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "aws_secret_access_key = [REDACTED:API_KEY] why denied?"
    content_not_contains: "wJalrXUtnFEMI"

- name: pii redacts a bearer token but keeps the header
  checkpoint: input
  messages:
    - {role: user, content: "curl -H 'Authorization: Bearer abcdefghijklmnopqrstuvwxyz0123456789' fails"}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "Authorization: Bearer [REDACTED:API_KEY]"
    content_not_contains: "abcdefghijklmnopqrstuvwxyz0123456789"

- name: pii allows a clean final answer
  checkpoint: output
  messages:
    - {role: user, content: "Where does customer 42 live?"}
  reply: {role: assistant, content: "Customer 42 lives in Krakow and has 3 open orders."}
  expect:
    action: allow
    check: pii_secrets

- name: pii redacts an IBAN in the final answer
  checkpoint: output
  messages:
    - {role: user, content: "What is the account of customer 42?"}
  reply: {role: assistant, content: "The account is PL61 1090 1014 0000 0712 1981 2874."}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "IBAN"
    content_contains: "The account is [REDACTED:IBAN]."
    content_not_contains: "PL61 1090 1014 0000 0712 1981 2874"

- name: pii types filter from the policy leaves other types alone
  checkpoint: input
  policy_patch: {checks: {pii_secrets: {types: [email]}}}
  messages:
    - {role: user, content: "ssn: 123-45-6789"}
  expect:
    action: allow
    check: pii_secrets

- name: pii extra pattern from the policy redacts a custom kind
  checkpoint: input
  policy_patch: {checks: {pii_secrets: {extra_patterns: [{kind: employee_id, pattern: 'EMP-\d{6}'}]}}}
  messages:
    - {role: user, content: "Promote EMP-123456 to team lead"}
  expect:
    action: redact
    check: pii_secrets
    reason_contains: "1 EMPLOYEE_ID"
    content_contains: "Promote [REDACTED:EMPLOYEE_ID] to team lead"

# A broken policy regex is a check error, and an error fails closed in redact mode.
- name: pii invalid extra pattern fails closed
  checkpoint: input
  policy_patch: {checks: {pii_secrets: {extra_patterns: [{kind: broken, pattern: "("}]}}}
  messages:
    - {role: user, content: "Hello"}
  expect:
    action: block
    check: pii_secrets
    reason_contains: "invalid regex"

# The dev policy sets skip_roles: [system], so a contact address in the owner's system prompt
# is left alone.
- name: pii leaves the system prompt alone
  checkpoint: input
  messages:
    - {role: system, content: "You are the ACME support agent. Escalate refunds to support@acme.example."}
    - {role: user, content: "How do I get a refund?"}
  expect:
    action: allow
    check: pii_secrets
    content_contains: "support@acme.example"

- name: pii still redacts the same address from the user
  checkpoint: input
  messages:
    - {role: system, content: "You are the ACME support agent."}
    - {role: user, content: "Please write to support@acme.example for me."}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "Please write to [REDACTED:EMAIL] for me."

- name: pii allows prose after password and token words
  checkpoint: output
  messages:
    - {role: user, content: "How do I reset my password?"}
  reply: {role: assistant, content: "Reset your password: click the link in the email. New password: choose at least 8 characters. Token: expired, please log in again."}
  expect:
    action: allow
    check: pii_secrets

- name: pii allows schema placeholders in a tool result
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show the login API schema"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {query: "schema"}}]}
    - {role: tool, tool_call_id: "1", content: '{"username": "string", "password": "string", "api_key": "<your key>", "token": "****"}'}
  expect:
    action: allow
    check: pii_secrets

- name: pii leaves an order id after an empty SSN field
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show the latest order"}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {query: "latest order"}}]}
    - {role: tool, tool_call_id: "1", content: '{"ssn": null, "order_id": 123456789}'}
  expect:
    action: allow
    check: pii_secrets
    content_contains: "123456789"

- name: pii redacts a bare secret-shaped password
  checkpoint: input
  messages:
    - {role: user, content: "Login fails, my password: hunter2! what now?"}
  expect:
    action: redact
    check: pii_secrets
    content_contains: "my password: [REDACTED:API_KEY]!"
    content_not_contains: "hunter2"
