[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a dedicated PostgreSQL test connection",
    "middleware: opt-in real BGE, indexed PostgreSQL, and backend checkout verification",
]
