# The AI Control Layer, its dashboard and the test application, for judges and local demos.
# The models run at OpenAI (OPENAI_API_KEY in .env); Ollama on the host is optional, for gemma4.
# Quick start:
#   docker compose up -d --build          # backend on :8000, dashboard on :5173
#   docker compose run --rm test-app --scenario all
# JWT_SECRET defaults to a public demo value so `up` works with no setup. For anything beyond a
# local demo, set your own: `docker compose run --rm init` writes a random one to .env.
name: ai-control-layer

x-jwt-secret: &jwt-secret ${JWT_SECRET:-hackyeah-demo-only-jwt-secret-change-me}

services:
  # Owns the network namespace the backend lives in. policy.yaml points at Ollama on
  # localhost:11434; this relay forwards that port to Ollama on the host, so the same policy file
  # works in Docker and outside it.
  net:
    image: alpine/socat:1.8.0.3
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; Docker Desktop provides it already
    ports:
      - "127.0.0.1:8000:8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: service:net
    depends_on: [net]
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SECRET: *jwt-secret
    volumes:
      # Mounted so hot reload, dashboard saves and audit logs use the files in this checkout.
      - ./backend/policy.yaml:/app/backend/policy.yaml
      - ./backend/signatures.yaml:/app/backend/signatures.yaml
      - ./backend/logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The playground's token is minted from JWT_SECRET and baked into the bundle at build
        # time: rebuild after changing the secret.
        JWT_SECRET: *jwt-secret
        VITE_PLAYGROUND_MODEL: ${PLAYGROUND_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on: [backend]

  test-app:
    profiles: [cli]
    build:
      context: .
      dockerfile: test_app/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      TEST_APP_PROXY_URL: http://net:8000/v1
      TEST_APP_MODEL: ${TEST_APP_MODEL:-gpt-4o-mini}
      JWT_SECRET: *jwt-secret
    volumes:
      - ./test_app/runs:/app/test_app/runs
    depends_on:
      backend:
        condition: service_healthy

  init:
    profiles: [setup]
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - .:/work
    command: ["python", "scripts/init_env.py"]
