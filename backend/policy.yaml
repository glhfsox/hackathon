# AI Control Layer policy: the only source of the layer's behaviour.
#
# LIVE EDITING
#   The backend checks this file about once a second. A valid change is in force within ~2 s,
#   without a restart. An invalid change is rejected with field-level errors, audited as
#   `policy_rejected`, and the previous policy stays active, so a typo never takes the system
#   down. The dashboard editor (PUT /api/policy) validates first and then writes this same file.
#   Unknown keys are errors, not silently ignored: that includes a misspelled check id, a
#   parameter the check does not take or a parameter of the wrong type. A key written twice in one
#   section is an error too (plain YAML would keep only the last one). Jev may only be on when
#   pii_secrets is on too, so Jev never sees unredacted PII.
#
# SECRETS
#   Never put an API key in this file. Jev's key is referenced by the NAME of an environment
#   variable (`jev.api_key_env`); the value is read from the environment, never stored here.
#
# CHECKPOINTS
#   input        the prompt the agent sends
#   tool_call    the model's reply asks to run a tool
#   tool_result  data a tool returned, on its way back to the model
#   output       the model's final answer to the agent
#
# ON / OFF
#   A check is on when its section exists under `checks` (`{}` or an empty key: on with its
#   defaults) and off when the section is left out. An enabled check runs at every checkpoint it
#   applies to. A finding blocks the request; pii_secrets instead replaces what it found and lets
#   the request through. A check that fails (error, timeout) blocks: never allow on an error.

# Shown in every audit record (plus a hash of this file's content). Bump it when you change things.
version: "0.2"

# Jev blocks when its risk score (0..1) is at or above this. Lower is stricter.
jev_threshold: 0.6

# MODELS agents may request. The key is the `model` name in the request.
#   upstream_base_url    any OpenAI-compatible endpoint the request is forwarded to
#   price_per_1k_tokens  used for cost estimates and cost budgets (local models cost 0)
#   timeout_s            seconds to wait for the upstream reply (default 120); after it the
#                        agent gets a refusal `upstream_unavailable`
models:
  gemma4:
    upstream_base_url: "http://localhost:11434/v1"
    price_per_1k_tokens: 0.0
    timeout_s: 120

# PERMISSIONS and ROLES: who may use which tool (RBAC, deny by default).
#   permissions  permission name -> the tools it grants
#   roles        role name -> the permissions it holds
#   A user's allowed tools are the union over the permissions of all their roles. A tool listed
#   in no permission is allowed to nobody. A role that names an undefined permission is an error.
#   Users are not listed here: their name and roles come from the signed token (JWT).
permissions:
  customers.read: [query_customers]
  files.read:     [read_file]
  web.read:       [http_get]
  shell.exec:     [run_shell]
  tasks.delegate: [delegate]

roles:
  support:      [customers.read]
  developer:    [customers.read, files.read, web.read, shell.exec]
  orchestrator: [tasks.delegate]

# CHECKS: one section per check; every key in a section is a PARAMETER handed to that check. A
# check accepts only the parameters listed for it below. Only jev takes `timeout_s`: the rule
# checks are fast synchronous code that a timeout could not interrupt. The `policy_loaded` audit
# row names every check that is off.
checks:
  # The requested model (every request to the model: input and tool_result) must be listed here,
  # and the tools the model asks for (tool_call) must be allowed to the user's roles (`roles`
  # above); anything else is blocked.
  #   allowed_models  must name models listed under `models`
  permissions:
    allowed_models: [gemma4]

  # Usage limits per role, counted per user (the token's `sub`) on every request to the model:
  # input and tool_result. A user gets the most generous limits of their roles; a user none of
  # whose roles is listed here is blocked.
  #   roles.<role>  requests_per_minute, tokens_per_day, cost_per_day; leave one out for no limit
  budget:
    roles:
      developer:    {requests_per_minute: 60, tokens_per_day: 200000, cost_per_day: 1.0}
      orchestrator: {requests_per_minute: 30, tokens_per_day: 100000, cost_per_day: 0.5}
      support:      {requests_per_minute: 30, tokens_per_day: 50000, cost_per_day: 0.5}

  # Runaway agents, counted per agent turn (tool calls since the last user message): more than
  # max_tool_calls tool calls, or the same tool with identical arguments more than max_repeats times.
  loop_detection:
    max_tool_calls: 10
    max_repeats: 3

  # Patterns from the external attack-signature feed (see `signatures` below).
  #   skip_roles  roles not scanned: the owner's system prompt may quote attacks; Jev still judges it
  signatures:
    skip_roles: [system]

  # Dangerous tool arguments.
  #   allowed_root  file paths in tool arguments must stay inside this directory
  #   categories    rule families to apply: shell, sql, path_traversal, deserialization
  #   max_command_chars  length limit, in characters, of a shell command in a tool argument
  tool_args:
    allowed_root: "/workspace"
    categories: [shell, sql, path_traversal, deserialization]
    max_command_chars: 2000

  # PII and secrets.
  #   types  detectors to run: email, phone, ssn, pesel, iban, card, api_key
  #   skip_roles  roles not scanned: the system prompt is written by the agent owner
  pii_secrets:
    types: [email, phone, ssn, pesel, iban, card, api_key]
    skip_roles: [system]

  # Jev, the AI decision maker. Its threshold is `jev_threshold` above. Always runs last.
  #   timeout_s  must exceed jev.timeout_s + jev.fallback.timeout_s, or a slow local fallback
  #              is cut off and the request fails closed.
  #   max_chars        size of one judged chunk; longer messages are judged chunk by chunk
  #   max_judge_calls  cap on chunks per request (1..1024); above it the check errors (fails closed)
  #   max_concurrency  most judge calls run in parallel (1..64)
  jev:
    timeout_s: 40
    max_chars: 4000
    max_judge_calls: 128
    max_concurrency: 8
    # Must list every role pii_secrets skips: unredacted text is never sent to Jev.
    skip_roles: [system]

# External attack-signature feed, managed outside this file.
#   source     file path or http(s) URL of the feed
#   refresh_s  how often the feed is re-read, in seconds
signatures:
  source: signatures.yaml
  refresh_s: 5

# Jev, the remote AI decision maker, and its local fallback.
#   model      must be a pinned version; "jev-latest" is rejected
#   api_key_env NAME of the env var holding the Jev API key
#   timeout_s  after this, the fallback model is asked instead
#   fallback   local OpenAI-compatible model (Ollama). If Jev and the fallback both fail, the
#              request fails closed (blocked).
jev:
  model: jev-1.13.0
  api_key_env: TYPESAFE_API_KEY
  base_url: "https://api.typesafe.ai"
  timeout_s: 3
  fallback:
    model: gemma4
    base_url: "http://localhost:11434/v1"
    timeout_s: 30
