# Loop detection. policy.yaml sets max_tool_calls: 10 and max_repeats: 3.
# Both limits count one agent turn: the tool calls since the last user message. Identical means
# same tool and same arguments regardless of key order.

- name: loop allows a short conversation with distinct tool calls
  checkpoint: tool_result
  messages:
    - {role: user, content: "List the files and then count the customers."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "1"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: query_customers, arguments: {query: "count"}}]}
    - {role: tool, content: "42", tool_call_id: "2"}
  expect:
    action: allow
    check: loop_detection

- name: loop allows the same call repeated exactly max_repeats times
  checkpoint: tool_result
  messages:
    - {role: user, content: "Check whether the build finished."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "1"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "2"}
    - {role: assistant, content: null, tool_calls: [{id: "3", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "3"}
  expect:
    action: allow
    check: loop_detection

- name: loop blocks the same call repeated more than max_repeats times
  checkpoint: tool_result
  messages:
    - {role: user, content: "Check whether the build finished."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "1"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "2"}
    - {role: assistant, content: null, tool_calls: [{id: "3", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "3"}
    - {role: assistant, content: null, tool_calls: [{id: "4", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "4"}
  expect:
    action: block
    check: loop_detection
    reason_contains: "max_repeats exceeded: run_shell called 4 times"

- name: loop treats reordered arguments as the same call
  checkpoint: tool_result
  messages:
    - {role: user, content: "Find customer 7."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 7, fields: "name"}}]}
    - {role: tool, content: "no rows", tool_call_id: "1"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: query_customers, arguments: {fields: "name", id: 7}}]}
    - {role: tool, content: "no rows", tool_call_id: "2"}
    - {role: assistant, content: null, tool_calls: [{id: "3", name: query_customers, arguments: {id: 7, fields: "name"}}]}
    - {role: tool, content: "no rows", tool_call_id: "3"}
    - {role: assistant, content: null, tool_calls: [{id: "4", name: query_customers, arguments: {fields: "name", id: 7}}]}
    - {role: tool, content: "no rows", tool_call_id: "4"}
  expect:
    action: block
    check: loop_detection
    reason_contains: "query_customers called 4 times"

- name: loop allows a conversation at a lowered max_tool_calls limit
  checkpoint: tool_result
  policy_patch: {checks: {loop_detection: {max_tool_calls: 3}}}
  messages:
    - {role: user, content: "Show three customers."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 1}}, {id: "2", name: query_customers, arguments: {id: 2}}, {id: "3", name: query_customers, arguments: {id: 3}}]}
    - {role: tool, content: "row 1", tool_call_id: "1"}
    - {role: tool, content: "row 2", tool_call_id: "2"}
    - {role: tool, content: "row 3", tool_call_id: "3"}
  expect:
    action: allow
    check: loop_detection

- name: loop blocks one tool call over a lowered max_tool_calls limit
  checkpoint: tool_result
  policy_patch: {checks: {loop_detection: {max_tool_calls: 3}}}
  messages:
    - {role: user, content: "Show four customers."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 1}}, {id: "2", name: query_customers, arguments: {id: 2}}, {id: "3", name: query_customers, arguments: {id: 3}}, {id: "4", name: query_customers, arguments: {id: 4}}]}
    - {role: tool, content: "row 1", tool_call_id: "1"}
    - {role: tool, content: "row 2", tool_call_id: "2"}
    - {role: tool, content: "row 3", tool_call_id: "3"}
    - {role: tool, content: "row 4", tool_call_id: "4"}
  expect:
    action: block
    check: loop_detection
    reason_contains: "max_tool_calls exceeded: 4 tool calls"

- name: loop blocks more than max_tool_calls distinct calls in one turn
  checkpoint: tool_result
  messages:
    - {role: user, content: "Show every customer one by one."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 1}}, {id: "2", name: query_customers, arguments: {id: 2}}, {id: "3", name: query_customers, arguments: {id: 3}}, {id: "4", name: query_customers, arguments: {id: 4}}, {id: "5", name: query_customers, arguments: {id: 5}}, {id: "6", name: query_customers, arguments: {id: 6}}]}
    - {role: tool, content: "row 1", tool_call_id: "1"}
    - {role: tool, content: "row 2", tool_call_id: "2"}
    - {role: tool, content: "row 3", tool_call_id: "3"}
    - {role: tool, content: "row 4", tool_call_id: "4"}
    - {role: tool, content: "row 5", tool_call_id: "5"}
    - {role: tool, content: "row 6", tool_call_id: "6"}
    - {role: assistant, content: null, tool_calls: [{id: "7", name: query_customers, arguments: {id: 7}}, {id: "8", name: query_customers, arguments: {id: 8}}, {id: "9", name: query_customers, arguments: {id: 9}}, {id: "10", name: query_customers, arguments: {id: 10}}, {id: "11", name: query_customers, arguments: {id: 11}}]}
    - {role: tool, content: "row 7", tool_call_id: "7"}
    - {role: tool, content: "row 8", tool_call_id: "8"}
    - {role: tool, content: "row 9", tool_call_id: "9"}
    - {role: tool, content: "row 10", tool_call_id: "10"}
    - {role: tool, content: "row 11", tool_call_id: "11"}
  expect:
    action: block
    check: loop_detection
    reason_contains: "max_tool_calls exceeded: 11 tool calls since the last user message"

# The same eleven calls belong to an earlier turn once the user asks something new.
- name: loop starts counting again at a new user message
  checkpoint: input
  messages:
    - {role: user, content: "Show every customer one by one."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: query_customers, arguments: {id: 1}}, {id: "2", name: query_customers, arguments: {id: 2}}, {id: "3", name: query_customers, arguments: {id: 3}}, {id: "4", name: query_customers, arguments: {id: 4}}, {id: "5", name: query_customers, arguments: {id: 5}}, {id: "6", name: query_customers, arguments: {id: 6}}]}
    - {role: tool, content: "row 1", tool_call_id: "1"}
    - {role: tool, content: "row 2", tool_call_id: "2"}
    - {role: tool, content: "row 3", tool_call_id: "3"}
    - {role: tool, content: "row 4", tool_call_id: "4"}
    - {role: tool, content: "row 5", tool_call_id: "5"}
    - {role: tool, content: "row 6", tool_call_id: "6"}
    - {role: assistant, content: null, tool_calls: [{id: "7", name: query_customers, arguments: {id: 7}}, {id: "8", name: query_customers, arguments: {id: 8}}, {id: "9", name: query_customers, arguments: {id: 9}}, {id: "10", name: query_customers, arguments: {id: 10}}, {id: "11", name: query_customers, arguments: {id: 11}}]}
    - {role: tool, content: "row 7", tool_call_id: "7"}
    - {role: tool, content: "row 8", tool_call_id: "8"}
    - {role: tool, content: "row 9", tool_call_id: "9"}
    - {role: tool, content: "row 10", tool_call_id: "10"}
    - {role: tool, content: "row 11", tool_call_id: "11"}
    - {role: assistant, content: "Those are the first eleven customers."}
    - {role: user, content: "Thanks. Which plan is customer 3 on?"}
  expect:
    action: allow
    check: loop_detection

- name: loop allows a tool call in a new turn after a busy earlier turn
  checkpoint: tool_result
  messages:
    - {role: user, content: "Check whether the build finished."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "1"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "2"}
    - {role: assistant, content: null, tool_calls: [{id: "3", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "3"}
    - {role: assistant, content: "The build has not finished yet."}
    - {role: user, content: "And now?"}
    - {role: assistant, content: null, tool_calls: [{id: "4", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md dist", tool_call_id: "4"}
  expect:
    action: allow
    check: loop_detection

- name: loop treats a trailing space in an argument as the same call
  checkpoint: tool_result
  messages:
    - {role: user, content: "Check whether the build finished."}
    - {role: assistant, content: null, tool_calls: [{id: "1", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "1"}
    - {role: assistant, content: null, tool_calls: [{id: "2", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "2"}
    - {role: assistant, content: null, tool_calls: [{id: "3", name: run_shell, arguments: {cmd: "ls"}}]}
    - {role: tool, content: "README.md", tool_call_id: "3"}
    - {role: assistant, content: null, tool_calls: [{id: "4", name: run_shell, arguments: {cmd: "ls "}}]}
    - {role: tool, content: "README.md", tool_call_id: "4"}
  expect:
    action: block
    check: loop_detection
    reason_contains: "max_repeats exceeded: run_shell called 4 times"
