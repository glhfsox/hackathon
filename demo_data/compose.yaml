name: treasury-demo

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: treasury_demo
      POSTGRES_DB: treasury_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in demo_data/.env}
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - treasury-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury_demo -d treasury_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  treasury-data:
